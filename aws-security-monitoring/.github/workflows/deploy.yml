name: Security Monitoring — Validate & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0

jobs:
  # ── Lint & validate Lambda functions ─────────────────────────────────────
  lint-lambda:
    name: Lint Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install bandit pylint

      - name: Run Bandit SAST on Lambda functions
        run: bandit -r lambda/ -ll -ii

      - name: Run Pylint
        run: pylint lambda/ --disable=C0114,C0115,C0116 --fail-under=7.0

  # ── Terraform validate & security scan ───────────────────────────────────
  terraform-validate:
    name: Terraform Validate & Checkov Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (local backend for validation)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Run Checkov IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ── Deploy (main branch only) ─────────────────────────────────────────────
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [lint-lambda, terraform-validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform plan
        run: |
          terraform -chdir=terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply tfplan

      - name: Print outputs
        run: terraform -chdir=terraform output
